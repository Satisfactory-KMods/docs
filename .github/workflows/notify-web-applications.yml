name: 📣 Notify web-applications

on:
  push:
    branches:
      - main

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: 📣 Trigger docs-deploy
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.WEB_APPLICATIONS_DISPATCH_TOKEN }}
          repository: Satisfactory-KMods/web-applications
          event-type: docs-content-updated
